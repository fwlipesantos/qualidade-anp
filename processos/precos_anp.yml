nome: precos_anp
finalidade: carregar os precos de combustiveis da ANP no modelo dimensional do Oracle, mantendo o historico dos postos
origem:
  - arquivo semestral da ANP (ca-AAAA-SS.csv)
destino:
  - oracle.stg_preco
  - oracle.dim_produto
  - oracle.dim_municipio
  - oracle.dim_data
  - oracle.dim_posto
  - oracle.fato_preco
  - oracle.rejeitado_preco
janela: segundas-feiras as 06:00, duracao esperada de ate 30 minutos
responsavel: Felipe Santos
